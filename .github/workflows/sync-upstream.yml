name: Sync from upstream

# 让 Fork 用户一键同步上游仓库的最新代码
# 用法：在你 Fork 后的仓库 → Actions → Sync from upstream → Run workflow
# 也支持每天自动检查上游更新（注意：GitHub 默认禁用 fork 里的定时任务，
# 需要 fork 主人在 Actions 设置中手动启用 scheduled workflows 才会自动跑）
#
# 同步策略：纯跟随 fork（无本地独有提交）直接对齐上游，历史与上游完全一致、
# 可快进；只有 fork 本地存在独有提交时才走 merge 合并（保留双方历史，不丢工作）。

on:
  schedule:
    # 每天凌晨 3 点自动检查（避免整点拥堵）
    - cron: '0 3 * * *'
  workflow_dispatch:
    # 手动触发：Actions → Sync from upstream → Run workflow

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync from upstream
        run: |
          # 添加上游仓库
          git remote add upstream https://github.com/free-zuike/beecount-cloud-workers.git || true
          git fetch upstream

          # 获取当前分支
          CURRENT_BRANCH=$(git branch --show-current)
          echo "Current branch: $CURRENT_BRANCH"

          # 纯跟随 fork（HEAD 是 upstream/main 的祖先，即没有本地独有提交）：
          # 直接对齐上游历史，避免 merge 制造分叉和残留旧提交链
          if git merge-base --is-ancestor HEAD upstream/main 2>/dev/null; then
            echo "No local commits — fast-forwarding to upstream"
            git reset --hard upstream/main
            git push --force-with-lease origin "$CURRENT_BRANCH"
          else
            # fork 有本地独有提交：合并保留双方历史（不会丢失本地工作）
            echo "Local commits detected — merging upstream"
            git merge upstream/main --no-edit
            git push origin "$CURRENT_BRANCH"
          fi

          echo "✅ Fork synced with upstream"

      - name: Create PR if merge conflicts
        if: failure()
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Sync from upstream"
          body: |
            自动同步上游仓库 [free-zuike/beecount-cloud-workers](https://github.com/free-zuike/beecount-cloud-workers) 的最新更新。

            如果合并冲突无法自动解决，会创建 PR 供手动处理。
          branch: sync-upstream
          base: ${{ github.ref_name }}
